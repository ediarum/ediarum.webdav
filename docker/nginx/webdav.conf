# Included in the server block of the base image's nginx (serversideup/php, fpm-nginx).

# WebDAV endpoint: every request goes straight to Laravel. ^~ keeps the image's regex locations
# from matching editors' files: the security rules deny dotfiles and *.bak/*.ini/*~ etc., and
# the static-asset rule would serve or 404 *.css/*.js itself instead of going through sabre.
location ^~ /connection/ {
    fastcgi_pass   127.0.0.1:9000;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param  SCRIPT_NAME     /index.php;
    fastcgi_read_timeout 300s;
}

# Admin API. The progress streams (initialize project, eXist-db sync, retries) send
# X-Accel-Buffering: no, which turns off fastcgi buffering for them; they can go quiet for a
# while during a long clone or push, hence the generous read timeout.
location ^~ /api/webdav/ {
    fastcgi_pass   127.0.0.1:9000;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param  SCRIPT_NAME     /index.php;
    fastcgi_read_timeout 3600s;
}

# Admin frontend: embed.js keeps its name across builds, assets/ are hashed. An add_header here
# replaces the server-level ones, so nosniff is repeated.
location = /apps/webdav/embed.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
location ^~ /apps/webdav/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
